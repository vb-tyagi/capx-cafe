# Local dev stack for the CLOSED monorepo — Postgres + Redis only, zero external keys.
# Host ports are offset (5433 / 6380) to avoid clashing with any local 5432 / 6379.
name: capx-culture

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: capx
      POSTGRES_PASSWORD: capx
      POSTGRES_DB: capx
    ports:
      - "5433:5432"
    volumes:
      - capx_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capx"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  capx_pg:
