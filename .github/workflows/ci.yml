name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Do NOT pass `version:` here — the pnpm version comes from package.json "packageManager".
      # Specifying it in both places makes action-setup fail with "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22' # >= 22.6 required for --experimental-strip-types
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # ONE gate, identical to what runs locally: node --test across packages + services + apps,
      # then tsc --noEmit. (The AGPL boundary-guard was retired at P0 when the fork was cold-archived —
      # tools/boundary-guard.mjs stays on disk, re-armable, but no longer gates CI. See STATE.md §5.5.)
      # The Postgres integration test self-skips without CHOKEPOINT_TEST_DB_URL, so CI needs no database.
      - run: pnpm run verify
